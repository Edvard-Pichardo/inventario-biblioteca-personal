<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de Edvard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
   (function(){
     var t = localStorage.getItem('theme');
     if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
     document.documentElement.setAttribute('data-theme', t);
   })();
 </script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <button class="welcome-badge" id="welcomeBadge" type="button"
        title="Haz clic para editar tu nombre">
  <span>Bienvenido <b id="welcomeName">Edvard Pichardo</b></span>
  <span class="welcome-edit" aria-hidden="true">✎</span>
  </button>
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">
  <!-- El icono cambiará con JavaScript -->
  </button>
  <div class="hero-count" id="heroCount">0<small>Libros físicos</small></div>
  <div class="hero-mini">
    <div class="stat"><b id="statLeidos">0</b><span>Leídos este año</span></div>
    <div class="stat"><b id="statDeseos">0</b><span>En lista de compras</span></div>
  </div>
</header>

<section class="quote-band">
  <p class="quote-text" id="dailyQuote">Un libro es un sueño que sostienes en tus manos.</p>
  <cite class="quote-author" id="dailyQuoteAuthor">— Neil Gaiman</cite>
</section>

<section class="shelves">
  <h2>Secciones</h2>
  <div class="shelf-grid" id="shelfGrid"></div>
</section>

<div class="tabs">
  <div class="tab active" data-tab="inventario">Inventario</div>
  <div class="tab" data-tab="leidos">Libros leídos</div>
  <div class="tab" data-tab="deseos">Por comprar</div>
</div>

<div class="toolbar" id="toolbar">
  <input type="text" id="fTexto" placeholder="Buscar por título…">
  <select id="fSeccion"><option value="">Sección</option></select>
  <select id="fUbicacion"><option value="">Ubicación</option></select>
  <select id="fIdioma"><option value="">Idioma</option></select>
  <select id="fFormato">
    <option value="">Formato</option>
    <option value="Pasta blanda">Pasta blanda</option>
    <option value="Pasta dura">Pasta dura (HC)</option>
  </select>
  <select id="fAutor"><option value="">Autor</option></select>
  <select id="fEstado">
    <option value="">Estado</option>
    <option value="leido">Leídos</option>
    <option value="no-leido">No leídos</option>
  </select>
  <button class="btn secondary" id="btnLimpiar">Limpiar filtros</button>
  <button class="btn" id="btnNuevo">+ Agregar libro</button>
  <button class="btn secondary" id="btnExportar" type="button">⬇ Exportar</button>
  <button class="btn secondary" id="btnImportar" type="button">⬆ Importar</button>
  <input type="file" id="fileImportar" accept="application/json" hidden>
</div>

<div class="section-toolbar" id="toolbarLeidos" style="display:none">
  <button class="btn" id="btnNuevoLeido" type="button">+ Agregar libro leído</button>
</div>

<div class="section-toolbar" id="toolbarDeseos" style="display:none">
  <button class="btn" id="btnNuevoDeseo" type="button">+ Agregar a lista de deseos</button>
</div>

<main>
  <div id="listaInventario"></div>
  <div id="listaLeidos" style="display:none"></div>
  <div id="listaDeseos" style="display:none"></div>

  <div class="bulkbar" id="bulkbar">
    <span id="bulkCount">0 seleccionados</span>
    <select id="bulkUbicacion"><option value="">Mover a ubicación…</option></select>
    <select id="bulkSeccion"><option value="">Cambiar sección…</option></select>
    <button class="btn danger" id="bulkEliminar">Eliminar seleccionados</button>
    <button class="btn secondary" id="bulkCancelar">Cancelar</button>
  </div>
</main>

<!-- Modal: agregar/editar libro -->
<div class="modal-bg" id="modalLibro">
  <div class="modal">
    <h3 id="modalTitulo">Agregar libro</h3>

    <div class="field isbn-row">
      <input type="text" id="fmIsbn" placeholder="Escanea o escribe el ISBN">
      <button class="btn secondary" id="btnBuscarIsbn" type="button">Autocompletar</button>
    </div>
    
    <div class="status-msg" id="isbnStatus"></div>

    <div class="field"><label>Título *</label><input type="text" id="fmTitulo"></div>

    <div class="field-row">
      <div class="field"><label>Autor(es), separados por coma</label><input type="text" id="fmAutores"></div>
      <div class="field"><label>Editorial</label><input type="text" id="fmEditorial"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Formato</label>
        <select id="fmFormato"><option value="">—</option><option value="Pasta blanda">Pasta blanda</option><option value="Pasta dura">Pasta dura (HC)</option></select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Sección</label><select id="fmSeccion"></select></div>
      <div class="field"><label>Ubicación</label><select id="fmUbicacion"></select></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Idioma</label><select id="fmIdioma"></select></div>
      <div class="field"><label>Condición</label>
        <select id="fmCondicion"><option value="">—</option><option>Nuevo</option><option>Bueno</option><option>Regular</option><option>Desgastado</option></select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Año de publicación</label><input type="number" id="fmAnio"></div>
      <div class="field"><label>Páginas</label><input type="number" id="fmPaginas"></div>
    </div>

    <div class="field"><label>Notas</label><textarea id="fmNotas"></textarea></div>

    <div class="modal-actions">
      <button class="btn secondary" id="btnCancelarModal">Cancelar</button>
      <button class="btn" id="btnGuardarLibro">Guardar</button>
    </div>
  </div>
</div>

<!-- Toasts + diálogo genérico -->
<div class="toast-container" id="toastContainer"></div>

<div class="dialog-bg" id="dialogBg">
  <div class="dialog">
    <p class="dialog-msg" id="dialogMsg"></p>
    <input type="text" class="dialog-input" id="dialogInput" hidden>
    <div class="dialog-actions">
      <button class="btn secondary" id="dialogCancel" type="button">Cancelar</button>
      <button class="btn" id="dialogOk" type="button">Aceptar</button>
    </div>
  </div>
</div>

<!-- Modal: agregar libro leído -->
<div class="modal-bg" id="modalLeido">
  <div class="modal">
    <h3>Agregar libro leído</h3>

    <div class="field"><label>Título *</label><input type="text" id="lmTitulo"></div>

    <div class="field-row">
      <div class="field"><label>Autor(es), separados por coma</label><input type="text" id="lmAutores"></div>
      <div class="field"><label>Editorial</label><input type="text" id="lmEditorial"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Formato</label>
        <select id="lmFormato">
          <option value="">—</option>
          <option value="Pasta blanda">Pasta blanda</option>
          <option value="Pasta dura">Pasta dura (HC)</option>
          <option value="Electrónico">Electrónico</option>
          <option value="Audiolibro">Audiolibro</option>
        </select>
      </div>
      <div class="field"><label>Páginas</label><input type="number" id="lmPaginas"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Año de publicación</label><input type="number" id="lmAnio"></div>
      <div class="field"><label>Fecha en que lo terminé</label><input type="date" id="lmFechaFin"></div>
    </div>

    <div class="field"><label>Calificación</label>
      <select id="lmCalificacion">
        <option value="">—</option>
        <option value="1">★</option><option value="2">★★</option>
        <option value="3">★★★</option><option value="4">★★★★</option>
        <option value="5">★★★★★</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="btnCancelarModalLeido" type="button">Cancelar</button>
      <button class="btn" id="btnGuardarLeido" type="button">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: agregar a lista de deseos -->
<div class="modal-bg" id="modalDeseo">
  <div class="modal">
    <h3>Agregar a lista de deseos</h3>

    <div class="field"><label>Título *</label><input type="text" id="dmTitulo"></div>

    <div class="field-row">
      <div class="field"><label>Autor(es)</label><input type="text" id="dmAutores"></div>
      <div class="field"><label>Editorial</label><input type="text" id="dmEditorial"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Páginas</label><input type="number" id="dmPaginas"></div>
      <div class="field"><label>Formato deseado</label>
        <select id="dmFormato">
          <option value="Cualquiera">Cualquiera</option>
          <option value="Pasta blanda">Pasta blanda</option>
          <option value="Pasta dura">Pasta dura (HC)</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Prioridad</label>
        <select id="dmPrioridad">
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
          <option value="Baja">Baja</option>
        </select>
      </div>
      <div class="field"><label>Precio estimado</label><input type="number" step="0.01" id="dmPrecio"></div>
    </div>

    <div class="field"><label>Motivo / notas</label><textarea id="dmMotivo"></textarea></div>

    <div class="modal-actions">
      <button class="btn secondary" id="btnCancelarModalDeseo" type="button">Cancelar</button>
      <button class="btn" id="btnGuardarDeseo" type="button">Guardar</button>
    </div>
  </div>
</div>

<script src="frases.js"></script>
<script src="app.js"></script>
</body>
</html>
